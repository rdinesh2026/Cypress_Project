name: Cypress E2E

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress specs in parallel
        run: npm run cy:run:parallel

      - name: Generate HTML report
        if: always()
        run: npm run report:html

      - name: Generate Allure report
        if: always()
        run: npm run report:allure

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts-${{ github.run_number }}
          path: |
            reports/parallel-report.html
            allure-report/**
            allure-results/**
            cypress/screenshots/**
            cypress/videos/**
          if-no-files-found: ignore
          retention-days: 7